<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 · Learn FDE</title>
  <style>
    :root {
      --bg: #08070d; --ink: #eceaf6; --muted: #9b96b8; --faint: #5c5878;
      --violet: #a855f7; --cyan: #22d3ee;
      --glass: rgba(255,255,255,0.045); --glass-border: rgba(255,255,255,0.12);
      --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans); background: var(--bg); color: var(--ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative; -webkit-font-smoothing: antialiased;
    }
    .glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 620px 420px at 12% -4%, rgba(168,85,247,0.34), transparent 62%),
        radial-gradient(ellipse 560px 400px at 92% 8%, rgba(34,211,238,0.28), transparent 62%),
        radial-gradient(ellipse 720px 520px at 50% 108%, rgba(168,85,247,0.22), transparent 64%);
    }
    .box { position: relative; z-index: 1; text-align: center; padding: 0 24px; }
    .code {
      font-family: var(--mono); font-weight: 700; font-size: clamp(88px, 18vw, 168px);
      line-height: 1; letter-spacing: -0.02em;
      background: linear-gradient(92deg, var(--violet) 10%, var(--cyan) 90%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .kicker { font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em; color: var(--cyan); margin-top: 20px; }
    .title { font-size: clamp(22px, 4vw, 32px); font-weight: 700; margin-top: 14px; letter-spacing: -0.01em; }
    .desc { color: var(--muted); font-size: 15px; margin-top: 12px; max-width: 40ch; margin-left: auto; margin-right: auto; }
    .home {
      display: inline-block; margin-top: 32px; font-family: var(--mono); font-size: 13px;
      color: #fff; text-decoration: none; padding: 11px 24px; border-radius: 999px;
      background: linear-gradient(90deg, var(--violet), var(--cyan));
      box-shadow: 0 0 22px rgba(168,85,247,0.45); transition: box-shadow .15s;
    }
    .home:hover { box-shadow: 0 0 30px rgba(34,211,238,0.6); }
    .brand { margin-top: 44px; font-family: var(--mono); font-size: 12px; color: var(--faint); }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="box">
    <div class="code">404</div>
    <div class="kicker">PAGE NOT FOUND · 页面不存在</div>
    <h1 class="title">这个页面走丢了</h1>
    <p class="desc">你访问的地址不存在，可能已被移动或删除。回到首页，从三条路径重新进入。</p>
    <a class="home" href="/">← 返回首页</a>
    <div class="brand">LearnFDE · learn-fde.com</div>
  </div>
</body>
</html>
